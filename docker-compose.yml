services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lpb
      POSTGRES_PASSWORD: lpb_dev_password
      POSTGRES_DB: lpb
    ports:
      # Host port 5440 avoids clashing with other local Postgres instances on 5432/5433
      - "${POSTGRES_HOST_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpb -d lpb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full app in one command: docker compose up --build  ->  http://localhost:4180
  # (`npm run db:up` still starts only Postgres for local development.)
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://lpb:lpb_dev_password@postgres:5432/lpb?schema=public
      PORT: "4100"
      STORAGE_DIR: /app/storage
    ports:
      - "${APP_HOST_PORT:-4180}:4100"
    volumes:
      - storage:/app/storage
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  pgdata:
  storage:
