services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lpb
      POSTGRES_PASSWORD: lpb_dev_password
      POSTGRES_DB: lpb
    ports:
      # Host port 5440 avoids clashing with other local Postgres instances on 5432/5433
      - "${POSTGRES_HOST_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpb -d lpb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
